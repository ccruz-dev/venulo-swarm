<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://raw.githubusercontent.com;">
  <title>Venulo Swarm Dashboard</title>
  <style>
    :root { color-scheme: dark; --bg:#071018; --panel:#0d1a25; --line:#203342; --text:#edf5fa; --muted:#91a5b4; --green:#48d597; --amber:#f6c762; --red:#ff7272; --blue:#61b7ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:15px/1.45 Inter,Segoe UI,Arial,sans-serif; color:var(--text); background:radial-gradient(circle at 15% 0%,#12324a 0,transparent 34%),var(--bg); }
    main { width:min(1120px,calc(100% - 32px)); margin:0 auto; padding:32px 0 48px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:clamp(26px,4vw,42px); letter-spacing:-.04em; }
    .subtitle,.muted { color:var(--muted); }
    button { border:1px solid var(--line); background:#132636; color:var(--text); border-radius:10px; padding:9px 14px; cursor:pointer; }
    button:hover { border-color:var(--blue); }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .card { background:linear-gradient(150deg,rgba(19,39,54,.96),rgba(10,24,34,.96)); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 16px 50px rgba(0,0,0,.18); }
    .card h2 { margin:0 0 12px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.09em; }
    .metric { font-size:30px; font-weight:750; }
    .status { display:inline-flex; align-items:center; gap:8px; font-weight:650; }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); box-shadow:0 0 14px currentColor; }
    .online .dot,.standby .dot { background:var(--green); color:var(--green); }
    .working .dot { background:var(--amber); color:var(--amber); }
    .offline .dot,.error .dot { background:var(--red); color:var(--red); }
    section { margin-top:18px; }
    .wide { padding:0; overflow:hidden; }
    .section-head { display:flex; justify-content:space-between; padding:18px; border-bottom:1px solid var(--line); }
    .section-head h2 { margin:0; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:13px 18px; text-align:left; border-bottom:1px solid rgba(32,51,66,.7); }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.07em; }
    tr:last-child td { border-bottom:0; }
    .pill { display:inline-block; padding:3px 9px; border-radius:999px; background:#183047; color:#b9dbf5; font-size:12px; }
    .errorbox { display:none; margin-top:18px; padding:14px 16px; border:1px solid #783d3d; border-radius:12px; background:#351b1b; color:#ffc4c4; }
    footer { display:flex; justify-content:space-between; gap:12px; margin-top:16px; color:var(--muted); font-size:12px; }
    @media (max-width:800px) { .grid { grid-template-columns:repeat(2,1fr); } header { flex-direction:column; } }
    @media (max-width:520px) { .grid { grid-template-columns:1fr; } th:nth-child(4),td:nth-child(4) { display:none; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>Venulo Swarm</h1><div class="subtitle">Agent activity, briefs, and review status</div></div>
    <button id="refresh" type="button">Refresh now</button>
  </header>
  <div class="grid">
    <div class="card"><h2>Runner</h2><div id="runner" class="status"><span class="dot"></span><span>Loading</span></div></div>
    <div class="card"><h2>Open briefs</h2><div id="open" class="metric">—</div></div>
    <div class="card"><h2>Completed</h2><div id="done" class="metric">—</div></div>
    <div class="card"><h2>Needs you</h2><div id="needs" class="metric">—</div></div>
  </div>
  <section class="card wide">
    <div class="section-head"><h2>Agents</h2><span id="updated" class="muted">Loading…</span></div>
    <table><thead><tr><th>Agent</th><th>State</th><th>Current brief</th></tr></thead><tbody id="agents"></tbody></table>
  </section>
  <section class="card wide">
    <div class="section-head"><h2>Briefs</h2><span id="briefCount" class="muted"></span></div>
    <table><thead><tr><th>Title</th><th>Owner</th><th>Status</th><th>Priority</th></tr></thead><tbody id="briefs"></tbody></table>
  </section>
  <div id="error" class="errorbox"></div>
  <footer><span>Reads the public Venulo swarm repository only.</span><span>Auto-refreshes every 60 seconds.</span></footer>
</main>
<script>
'use strict';
const DATA_URL='https://raw.githubusercontent.com/ccruz-dev/venulo-swarm/main/status/dashboard.json';
const $=id=>document.getElementById(id);
function cell(row,value,cls){const td=document.createElement('td');const el=document.createElement(cls?'span':'span');if(cls)el.className=cls;el.textContent=value??'—';td.appendChild(el);row.appendChild(td);}
function stateLabel(value){return String(value||'unknown').replace(/-/g,' ');}
async function load(){
  $('error').style.display='none';
  try{
    const res=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('Dashboard request failed: '+res.status);
    const data=await res.json();
    const stats=data.stats||{};
    $('open').textContent=stats.open??0; $('done').textContent=stats.done_total??0; $('needs').textContent=stats.needs_human??0;
    const runnerState=data.agents?.runner?.state||'unknown';
    $('runner').className='status '+runnerState; $('runner').lastElementChild.textContent=stateLabel(runnerState);
    $('updated').textContent=data.updated?'Updated '+new Date(data.updated).toLocaleString():'Update time unavailable';
    const agents=$('agents'); agents.replaceChildren();
    for(const [name,agent] of Object.entries(data.agents||{})){
      const row=document.createElement('tr'); cell(row,name); cell(row,stateLabel(agent.state),'pill'); cell(row,agent.current_title||agent.note||'—'); agents.appendChild(row);
    }
    const briefs=$('briefs'); briefs.replaceChildren(); const items=Array.isArray(data.briefs)?data.briefs:[]; $('briefCount').textContent=items.length+' total';
    if(!items.length){const row=document.createElement('tr');const td=document.createElement('td');td.colSpan=4;td.className='muted';td.textContent='No briefs yet.';row.appendChild(td);briefs.appendChild(row);}
    for(const brief of items){const row=document.createElement('tr');cell(row,brief.title||brief.id);cell(row,brief.owner);cell(row,stateLabel(brief.status),'pill');cell(row,brief.priority||'normal');briefs.appendChild(row);}
  }catch(err){$('error').textContent='Could not load the public dashboard. Check your internet connection and try Refresh now. '+err.message;$('error').style.display='block';}
}
$('refresh').addEventListener('click',load); load(); setInterval(load,60000);
</script>
</body>
</html>
